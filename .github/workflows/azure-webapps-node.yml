# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-nodejs?tabs=linux&pivots=development-environment-cli
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and NODE_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_DEPLOY_ENABLED: 'false' # set to 'true' to enable Azure deployment
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || '' }} # set as a repository variable (Settings > Secrets and variables > Actions)
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                # set this to the node version to use

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployment_configured: ${{ steps.deployment-config.outputs.configured }}
    steps:
    - uses: actions/checkout@v4

    - name: Detect Node.js project files
      id: node-files
      run: |
        project_path_input="${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
        candidate_path="$GITHUB_WORKSPACE/$project_path_input"
        project_path="."

        if [ ! -d "$candidate_path" ]; then
          echo "has_package=false" >> "$GITHUB_OUTPUT"
          echo "has_npm_lock=false" >> "$GITHUB_OUTPUT"
          echo "project_path=$project_path" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        workspace_path="$(realpath "$GITHUB_WORKSPACE")"
        resolved_project_path="$(realpath "$candidate_path")"

        case "$resolved_project_path" in
          "$workspace_path") ;;
          "$workspace_path"/*)
            project_path="${resolved_project_path#"$workspace_path"/}"
            ;;
          *)
            echo "::error::AZURE_WEBAPP_PACKAGE_PATH must stay within the repository."
            exit 1
            ;;
        esac

        cache_prefix=""
        if [ "$project_path" != "." ]; then
          cache_prefix="$project_path/"
        fi

        echo "project_path=$project_path" >> "$GITHUB_OUTPUT"
        cd -- "$resolved_project_path"

        if [ -f package.json ]; then
          echo "has_package=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_package=false" >> "$GITHUB_OUTPUT"
        fi

        if [ -f package-lock.json ]; then
          echo "has_npm_lock=true" >> "$GITHUB_OUTPUT"
          echo "cache_dependency_path=${cache_prefix}package-lock.json" >> "$GITHUB_OUTPUT"
        elif [ -f npm-shrinkwrap.json ]; then
          echo "has_npm_lock=true" >> "$GITHUB_OUTPUT"
          echo "cache_dependency_path=${cache_prefix}npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
        else
          echo "has_npm_lock=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js with npm cache
      if: ${{ steps.node-files.outputs.has_package == 'true' && steps.node-files.outputs.has_npm_lock == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache-dependency-path: ${{ steps.node-files.outputs.cache_dependency_path }}
        cache: 'npm'

    - name: Set up Node.js
      if: ${{ steps.node-files.outputs.has_package == 'true' && steps.node-files.outputs.has_npm_lock == 'false' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: npm install, build, and test
      if: ${{ steps.node-files.outputs.has_package == 'true' }}
      # Run npm commands from the configured application path.
      working-directory: ${{ steps.node-files.outputs.project_path }}
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Check Azure deployment configuration
      id: deployment-config
      env:
        AZURE_WEBAPP_DEPLOY_ENABLED: ${{ env.AZURE_WEBAPP_DEPLOY_ENABLED }}
        AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        if [ "$AZURE_WEBAPP_DEPLOY_ENABLED" != "true" ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Azure deployment is disabled; skipping deploy artifact upload."
        elif [ -z "$AZURE_WEBAPP_NAME" ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Repository variable AZURE_WEBAPP_NAME is not set; skipping deploy artifact upload."
        elif [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "Secret AZURE_WEBAPP_PUBLISH_PROFILE is not set; skipping deploy artifact upload."
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload artifact for deployment job
      if: ${{ steps.deployment-config.outputs.configured == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy:
    # Deploy automatically when build succeeds and deployment configuration is complete.
    if: needs.build.outputs.deployment_configured == 'true'
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      # Deploy targets the Production environment; configure environment protection rules in repository settings if approval gates are required.
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
