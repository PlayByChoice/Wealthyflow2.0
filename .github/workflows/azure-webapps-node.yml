# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-nodejs?tabs=linux&pivots=development-environment-cli
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and NODE_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Build and Deploy to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_enabled:
        description: "Deploy to live production"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  AZURE_WEBAPP_NAME: wealthflow2.0    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                # set this to the node version to use

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_enabled: ${{ steps.deploy_gate.outputs.enabled }}
    steps:
    - uses: actions/checkout@v4

    - name: Determine whether deployment is enabled
      id: deploy_gate
      run: |
        if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.deploy_enabled }}" = "true" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Detect Node project
      id: node_project
      run: |
        if [ -f package.json ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: npm install, build, and test
      if: steps.node_project.outputs.exists == 'true'
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      if: steps.deploy_gate.outputs.enabled == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy:
    if: needs.build.outputs.deploy_enabled == 'true'
    permissions:
      contents: none
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    concurrency:
      group: production-deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: Validate Azure deployment secrets
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: |
        missing=0
        [ -z "$AZURE_CLIENT_ID" ] && echo "::error::Missing required secret: AZURE_CLIENT_ID" && missing=1
        [ -z "$AZURE_TENANT_ID" ] && echo "::error::Missing required secret: AZURE_TENANT_ID" && missing=1
        [ -z "$AZURE_SUBSCRIPTION_ID" ] && echo "::error::Missing required secret: AZURE_SUBSCRIPTION_ID" && missing=1
        if [ "$missing" -ne 0 ]; then
          exit 2
        fi

    - name: Show deployment configuration
      run: |
        echo "Deploying to app: $AZURE_WEBAPP_NAME"
        echo "Package path: $AZURE_WEBAPP_PACKAGE_PATH"
        echo "Git ref: $GITHUB_REF"

    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
